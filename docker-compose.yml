version: '3.8'

services:
  db:
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=123456
      - MARIADB_DATABASE=geohealth_jhcis
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - '3337:3306'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=mysql://root:123456@db:3306/geohealth_jhcis
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mariadb_data:
